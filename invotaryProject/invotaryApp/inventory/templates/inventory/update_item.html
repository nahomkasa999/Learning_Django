{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Item</title>
    <link rel="stylesheet" href="{% static 'inventory/css/style.css' %}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="{% url 'home' %}" class="navbar-brand">InventoryPro</a>
        <ul class="navbar-nav">
            <li><a href="{% url 'home' %}">Dashboard</a></li>
            <li><a href="{% url 'create_item' %}" class="btn btn-primary btn-sm">Add Item</a></li>
        </ul>
    </nav>

    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>Update Product</h1>
                <p class="subtitle">Edit the product details below</p>
            </div>
            <a href="{% url 'home' %}" class="btn btn-outline">&larr; Back to Dashboard</a>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div style="display:flex; gap:10px; margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary">Update Product</button>
                    <a href="{% url 'home' %}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
